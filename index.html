<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFE000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Yellow Car">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Yellow Car!</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --yellow: #FFE000;
    --black: #0f0f0f;
    --surface: #181818;
    --surface2: #242424;
    --p1: #FF4D6D;
    --p2: #3B9EFF;
    --green: #4ade80;
    --text-dim: #555;
  }

  html, body {
    height: 100%;
    background: var(--black);
    font-family: 'Nunito', sans-serif;
    color: #fff;
    overflow-x: hidden;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    position: relative;
  }

  .road-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .road-bg::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 6px;
    transform: translateX(-50%);
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,224,0,0.12) 0, rgba(255,224,0,0.12) 40px,
      transparent 40px, transparent 80px
    );
    animation: road 1.2s linear infinite;
  }
  @keyframes road { to { background-position: 0 80px; } }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    padding-bottom: 1.5rem;
    transition: padding-top 0.4s;
  }

  /* Header shrinks when listening */
  .header {
    padding: 1.2rem 1rem 0.3rem;
    text-align: center;
    transition: all 0.4s;
    overflow: hidden;
  }
  .listening-active .header {
    padding: 0.5rem 1rem 0.1rem;
  }
  .title {
    font-family: 'Bangers', cursive;
    font-size: clamp(2.8rem, 11vw, 5rem);
    color: var(--yellow);
    letter-spacing: 0.06em;
    line-height: 1;
    text-shadow: 3px 3px 0 #000, 0 0 30px rgba(255,224,0,0.3);
    transition: font-size 0.4s;
  }
  .listening-active .title {
    font-size: clamp(1.6rem, 6vw, 2.8rem);
  }
  .car-icon {
    font-size: clamp(1.8rem, 7vw, 3rem);
    display: inline-block;
    animation: carwiggle 3s ease-in-out infinite;
    transition: font-size 0.4s;
  }
  .listening-active .car-icon {
    font-size: clamp(1rem, 4vw, 1.8rem);
  }
  @keyframes carwiggle {
    0%,100% { transform: rotate(-4deg) translateY(0); }
    50% { transform: rotate(4deg) translateY(-5px); }
  }

  /* Status bar */
  .status-bar {
    width: calc(100% - 2rem);
    max-width: 460px;
    margin: 0.5rem 0 0;
    background: var(--surface);
    border-radius: 14px;
    padding: 0.7rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    border: 1px solid #2a2a2a;
    transition: border-color 0.3s, background 0.3s, transform 0.4s;
  }
  /* When listening, status bar is more prominent */
  .listening-active .status-bar {
    margin-top: 0.4rem;
  }
  .status-bar.wake    { border-color: #333; }
  .status-bar.armed   { border-color: var(--yellow); background: rgba(255,224,0,0.08); }
  .status-bar.scoring { border-color: var(--green);  background: rgba(74,222,128,0.08); }
  .status-bar.error   { border-color: #ff6b6b; background: rgba(255,100,100,0.06); }
  .status-bar.off     { border-color: #2a2a2a; opacity: 0.6; }

  .pulse-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--text-dim);
    transition: background 0.3s;
  }
  .status-bar.wake    .pulse-dot { background: var(--green); animation: blink 1.4s ease-in-out infinite; }
  .status-bar.armed   .pulse-dot { background: var(--yellow); animation: blink 0.6s ease-in-out infinite; }
  .status-bar.scoring .pulse-dot { background: var(--green); animation: none; }
  .status-bar.error   .pulse-dot { background: #ff6b6b; animation: none; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }

  .status-msg {
    font-size: 0.82rem;
    font-weight: 700;
    color: #aaa;
    transition: color 0.3s;
    flex: 1;
  }
  .status-bar.wake    .status-msg { color: #aaa; }
  .status-bar.armed   .status-msg { color: var(--yellow); }
  .status-bar.scoring .status-msg { color: var(--green); }
  .status-bar.error   .status-msg { color: #ff6b6b; }

  /* Scoreboard */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    width: calc(100% - 2rem);
    max-width: 460px;
    margin: 0.7rem 0 0;
    transition: margin 0.4s;
  }

  .player-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 1.1rem 0.8rem 1rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    border: 2.5px solid var(--surface2);
    transition: border-color 0.3s;
  }
  .player-card.p1 { border-color: var(--p1); }
  .player-card.p2 { border-color: var(--p2); }
  .player-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.07;
  }
  .player-card.p1::before { background: radial-gradient(circle at 50% 0%, var(--p1), transparent 70%); }
  .player-card.p2::before { background: radial-gradient(circle at 50% 0%, var(--p2), transparent 70%); }
  .player-card.pop {
    animation: card-pop 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes card-pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .crown {
    position: absolute;
    top: 7px; right: 9px;
    font-size: 1rem;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s, transform 0.3s;
  }
  .crown.visible { opacity: 1; transform: translateY(0); }

  .p-name {
    font-size: 0.78rem;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
    display: inline-block;
    color: inherit;
  }
  .player-card.p1 .p-name { color: var(--p1); }
  .player-card.p2 .p-name { color: var(--p2); }

  /* Edit button on each card */
  .edit-name-btn {
    position: absolute;
    top: 7px; left: 9px;
    background: none;
    border: none;
    font-size: 0.75rem;
    cursor: pointer;
    opacity: 0.35;
    padding: 2px;
    line-height: 1;
    transition: opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .edit-name-btn:active { opacity: 1; }

  .score-num {
    font-family: 'Bangers', cursive;
    font-size: clamp(3.8rem, 14vw, 5.5rem);
    line-height: 1;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  .score-sub {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 0.1rem;
  }

  /* Controls */
  .controls {
    width: calc(100% - 2rem);
    max-width: 460px;
    margin-top: 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .listen-toggle {
    width: 100%;
    padding: 0.95rem;
    border-radius: 16px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 0.06em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: transform 0.12s, background 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  .listen-toggle:active { transform: scale(0.97); }
  .listen-toggle.on  { background: var(--yellow); color: var(--black); }
  .listen-toggle.off { background: var(--surface2); color: #888; border: 1px solid #333; }

  .wake-hint {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.04em;
  }
  .wake-hint span { color: var(--yellow); font-style: italic; }

  .manual-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.65rem;
  }

  .manual-btn {
    padding: 0.8rem;
    border-radius: 14px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.12s;
    -webkit-tap-highlight-color: transparent;
    color: #fff;
  }
  .manual-btn:active { transform: scale(0.95); opacity: 0.85; }
  .manual-btn.p1 { background: var(--p1); }
  .manual-btn.p2 { background: var(--p2); }

  .reset-btn {
    width: 100%;
    padding: 0.65rem;
    border-radius: 12px;
    background: transparent;
    border: 1.5px solid #333;
    color: #555;
    font-family: 'Nunito', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .reset-btn:active { border-color: #888; color: #aaa; }

  /* Confetti */
  .confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
  .c { position: absolute; top: -12px; opacity: 0; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(105vh) rotate(800deg) scale(0.5); }
  }

  .score-flash { position: fixed; inset: 0; z-index: 998; pointer-events: none; opacity: 0; transition: opacity 0.1s; }
  .score-flash.p1 { background: radial-gradient(circle, rgba(255,77,109,0.25), transparent 70%); }
  .score-flash.p2 { background: radial-gradient(circle, rgba(59,158,255,0.25), transparent 70%); }
  .score-flash.wake { background: radial-gradient(circle, rgba(255,224,0,0.35), transparent 70%); }
  .score-flash.show { opacity: 1; }

  .no-speech-msg {
    display: none;
    background: #1a1000;
    border: 1px solid #4a3500;
    border-radius: 12px;
    color: #ffcc44;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.65rem 1rem;
    text-align: center;
    width: calc(100% - 2rem);
    max-width: 460px;
    margin-top: 0.5rem;
    line-height: 1.5;
  }
  .no-speech-msg.show { display: block; }

  /* ── HISTORY ── */
  .history-section {
    width: calc(100% - 2rem);
    max-width: 460px;
    margin-top: 0.8rem;
  }
  .history-header {
    font-size: 0.65rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-clear {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.65rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .history-clear:active { color: #aaa; }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    max-height: 220px;
    overflow-y: auto;
  }
  .history-item {
    background: var(--surface);
    border-radius: 10px;
    padding: 0.5rem 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.78rem;
    font-weight: 700;
    animation: slide-in 0.3s ease;
    border-left: 3px solid transparent;
  }
  .history-item.p1 { border-left-color: var(--p1); }
  .history-item.p2 { border-left-color: var(--p2); }
  @keyframes slide-in {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .history-car { font-size: 1rem; flex-shrink: 0; }
  .history-name { flex: 1; }
  .history-name.p1c { color: var(--p1); }
  .history-name.p2c { color: var(--p2); }
  .history-time {
    font-size: 0.68rem;
    color: var(--text-dim);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .history-empty {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-weight: 700;
    text-align: center;
    padding: 0.6rem;
  }
</style>
</head>
<body>

<div class="road-bg"></div>
<div style="position:fixed;bottom:8px;right:10px;font-size:0.6rem;font-weight:700;color:#333;letter-spacing:0.08em;z-index:10;pointer-events:none">v1.10</div>
<div class="score-flash" id="flash"></div>
<div class="confetti-layer" id="confetti"></div>

<div class="content" id="mainContent">
  <div class="header">
    <div><span class="car-icon">🚗</span></div>
    <div class="title">YELLOW CAR!</div>
  </div>

  <div class="status-bar off" id="statusBar">
    <div class="pulse-dot"></div>
    <div class="status-msg" id="statusMsg">Listening is off</div>
  </div>

  <div class="no-speech-msg" id="noSpeechMsg">
    ⚠️ Speech recognition isn't available.<br>Use the manual buttons below.
  </div>

  <div class="scoreboard">
    <div class="player-card p1" id="card1">
      <span class="crown" id="crown1">👑</span>
      <button class="edit-name-btn" onclick="editName(1)" title="Edit name">✏️</button>
      <div class="p-name p1" id="name1">Daddy</div>
      <div class="score-num" id="score1">0</div>
      <div class="score-sub">Points</div>
    </div>
    <div class="player-card p2" id="card2">
      <span class="crown" id="crown2">👑</span>
      <button class="edit-name-btn" onclick="editName(2)" title="Edit name">✏️</button>
      <div class="p-name p2" id="name2">Ben</div>
      <div class="score-num" id="score2">0</div>
      <div class="score-sub">Points</div>
    </div>
  </div>

  <div class="controls">
    <button class="listen-toggle off" id="listenBtn" onclick="toggleListen()">
      <span id="listenIcon">🎤</span>
      <span id="listenLabel">START LISTENING</span>
    </button>

    <div class="wake-hint">Say <span>"Yellow Car"</span> then the player's name<br><span style="font-size:0.65rem;color:var(--text-dim);font-style:normal">For short names say <span style="color:var(--yellow)">"it's Ben"</span> or <span style="color:var(--yellow)">"for Ben"</span></span></div>

    <div class="manual-row">
      <button class="manual-btn p1" onclick="score(1)">+1 <span id="mName1">Daddy</span></button>
      <button class="manual-btn p2" onclick="score(2)">+1 <span id="mName2">Ben</span></button>
    </div>

    <button class="reset-btn" onclick="resetScores()">🔄 Reset Scores</button>
  </div>

  <div class="history-section" id="historySection">
    <div class="history-header">
      <span>🚗 Yellow Car Log</span>
      <button class="history-clear" onclick="clearHistory()">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty" id="historyEmpty">No cars spotted yet!</div>
    </div>
  </div>
</div>

<script>

  let scores = [0, 0];
  let listening = false;
  let recognition = null;
  let restartTimer = null;
  let armed = false;
  let armedTimer = null;

  // Levenshtein distance — used by both wake word and name matching
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({length: m+1}, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]
          : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    return dp[m][n];
  }

  // Exact phrase matches — covers SR mishears, kids voices, partial phrases
  const WAKE_WORDS = [
    // Standard
    'yellow car', 'yellow card', 'yellow ca', 'yellow ka',
    // SR mishears of "yellow"
    'yello car', 'yello card', 'jello car', 'hello car',
    'fellow car', 'mellow car', 'below car',
    'yellow bar', 'yellow far', 'yellow jar', 'yellow star', 'yellow tar',
    // Kids voice / fast speech
    'yella car', 'yella', 'yellar', 'yeller',
    'ellow car', 'ello car',
    // Partial — just "yellow" on its own is distinctive enough in context
    // handled separately in woke detection below
  ];

  // Single word triggers — low false-positive risk in a car game context
  const WAKE_SINGLE = [
    'yellow', 'yello', 'yella', 'yeller', 'yellar', 'jello', 'yelo'
  ];

  // Phrase fragments that suggest a yellow car sighting
  const WAKE_PHRASES = [
    "that's yellow", "thats yellow", "it's yellow", "its yellow",
    "look yellow", "see yellow", "a yellow", "the yellow",
    "yellow one", "yellow vehicle", "yellow van", "yellow truck",
    "yellow bus", "yellow cab", "yellow taxi",
  ];

  function isWakeWord(text) {
    if (WAKE_WORDS.some(w => text.includes(w))) return true;
    if (WAKE_PHRASES.some(w => text.includes(w))) return true;
    // Single word match — only trigger if the WHOLE transcript is just the word
    // or it's a very short utterance (kids saying just "yellow!")
    const words = text.trim().split(/\s+/);
    if (words.length <= 3 && WAKE_SINGLE.some(w => words.some(word => word === w || levenshtein(word, w) <= 1))) return true;
    return false;
  }
  const ARMED_TIMEOUT = 5000;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById('noSpeechMsg').classList.add('show');
    document.getElementById('listenBtn').disabled = true;
    document.getElementById('listenBtn').style.opacity = '0.4';
    setStatus('error', 'Speech not supported — use buttons');
  } else {
    buildRecognition();
  }

  function buildRecognition() {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'en-GB';
    recognition.maxAlternatives = 3;

    recognition.onresult = (e) => {
      const transcripts = [];
      for (let i = 0; i < e.results.length; i++) {
        for (let j = 0; j < e.results[i].length; j++) {
          transcripts.push(e.results[i][j].transcript.toLowerCase().trim());
        }
      }
      // Use all alternatives joined — gives more chances to match
      const text = transcripts.join(' ');
      // Also build a deduplicated word set across all alternatives for fuzzy checks
      const allWords = [...new Set(text.split(/\s+/).filter(Boolean))];

      if (!armed) {
        if (isWakeWord(text)) {
          arm();
        } else if (e.results[e.results.length - 1].isFinal) {
          // Show what was heard briefly so you can see what SR is picking up
          setStatus('wake', `Listening… heard: "${transcripts[0] || '…'}"`);
          setTimeout(() => {
            if (listening && !armed) setStatus('wake', 'Listening… say "Yellow Car"');
          }, 2500);
        }
      } else {
        if (e.results[e.results.length - 1].isFinal) {
          const n1 = getName(1);
          const n2 = getName(2);
          let matched = false;

          // Always show exactly what was heard — helps debug misses
          setStatus('armed', `Heard: "${transcripts[0]}" — who?`);

          function fuzzyMatch(haystack, name) {
            if (!name || name.length < 2) return false;
            if (haystack.includes(name)) return true;

            // Phonetic mishear tables — tuned for UK English speech recognition
            const MISHEARS = {
              'ben':   ['been','bin','band','pen','when','bean','bend','bet','bed',
                        'men','ten','den','hen','yen','ken','fen','bun','ban','bone',
                        'barn','burn','born','vein','vain','then','them','end','and',
                        'friend','blend','spend','trend','bent','dent','rent','sent',
                        'went','lent','meant','bland','blank','blank','blend','in','on'],
              'daddy': ['daddy','dadi','dadie','deadie','teddy','ready','lady'],
              'dad':   ['bad','had','mad','add','lad'],
            };

            const mishearList = MISHEARS[name] || [];
            if (mishearList.some(m => haystack.includes(m))) return true;

            // Levenshtein per word — short names get distance 1, longer get more
            const tolerance = name.length <= 3 ? 1 : name.length <= 5 ? 2 : Math.floor(name.length / 3);
            if (haystack.split(/\s+/).some(w => w.length >= 2 && levenshtein(w, name) <= tolerance)) return true;

            // Last resort: does any word START with the same 2 chars?
            // Catches "ben" → "bend", "benz", "bent" etc where SR adds a char
            if (name.length >= 3) {
              const prefix = name.slice(0, 2);
              if (haystack.split(/\s+/).some(w => w.startsWith(prefix) && levenshtein(w, name) <= 2)) return true;
            }

            return false;
          }

          // Strip common lead-in phrases so "it's Ben" → "ben", "for Daddy" → "daddy"
          const PREFIXES = ["it's ", "its ", "for ", "it was ", "that's ", "thats ", "give it to "];
          let cleanText = text;
          PREFIXES.forEach(p => { if (cleanText.startsWith(p)) cleanText = cleanText.slice(p.length).trim(); });
          // Also check the cleaned version alongside the full text
          const p1 = fuzzyMatch(text, n1) || fuzzyMatch(cleanText, n1) || text.includes('player one') || text.includes('player 1');
          const p2 = fuzzyMatch(text, n2) || fuzzyMatch(cleanText, n2) || text.includes('player two') || text.includes('player 2');

          if (p1 && !p2) { score(1, true); matched = true; }
          else if (p2 && !p1) { score(2, true); matched = true; }
          else if (p1 && p2) {
            score(levenshtein(text, n1) <= levenshtein(text, n2) ? 1 : 2, true);
            matched = true;
          }

          if (!matched) {
            if (isWakeWord(text)) { arm(); }
            else {
              disarm();
              // Keep showing what was heard so you can see why it missed
              setStatus('error', `Heard "${transcripts[0]}" — say "Yellow Car" to retry`);
              setTimeout(() => {
                if (listening && !armed) setStatus('wake', 'Listening… say "Yellow Car"');
              }, 3000);
            }
          }
        } else {
          setStatus('armed', `Heard: "${transcripts[0]}"…`);
        }
      }
    };

    recognition.onerror = (e) => {
      if (e.error === 'no-speech') {
        // Expected silence — loop restarts automatically
      } else if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = false;
        setListenBtn(false);
        setStatus('error', 'Mic permission denied — check browser settings');
        document.getElementById('noSpeechMsg').classList.add('show');
      } else if (e.error === 'network') {
        setStatus('error', 'Network error — retrying…');
      }
    };

    recognition.onend = () => {
      if (listening) {
        restartTimer = setTimeout(() => {
          try { recognition.start(); } catch(err) {}
        }, 150);
      }
    };
  }

  function arm() {
    armed = true;
    clearTimeout(armedTimer);
    playWakePing();
    const wakeFlash = document.getElementById('flash');
    wakeFlash.className = 'score-flash wake show';
    setTimeout(() => wakeFlash.classList.remove('show'), 400);
    setStatus('armed', '🟡 "Yellow Car!" — who got it?');
    armedTimer = setTimeout(() => {
      if (armed) {
        disarm();
        setStatus('wake', 'Timed out — say "Yellow Car" again');
      }
    }, ARMED_TIMEOUT);
  }

  function disarm() {
    armed = false;
    clearTimeout(armedTimer);
  }

  function toggleListen() {
    if (!SpeechRecognition) return;
    listening = !listening;
    setListenBtn(listening);

    const content = document.getElementById('mainContent');
    if (listening) {
      armed = false;
      content.classList.add('listening-active');
      setStatus('wake', 'Listening… say "Yellow Car"');
      try { recognition.start(); } catch(e) {}
      requestWakeLock();
    } else {
      clearTimeout(restartTimer);
      clearTimeout(armedTimer);
      armed = false;
      content.classList.remove('listening-active');
      try { recognition.stop(); } catch(e) {}
      setStatus('off', 'Listening is off');
    }
  }

  function setListenBtn(on) {
    document.getElementById('listenBtn').className = 'listen-toggle ' + (on ? 'on' : 'off');
    document.getElementById('listenIcon').textContent = on ? '⏹️' : '🎤';
    document.getElementById('listenLabel').textContent = on ? 'STOP LISTENING' : 'START LISTENING';
  }

  function score(player, fromVoice = false) {
    disarm();
    scores[player - 1]++;
    document.getElementById(`score${player}`).textContent = scores[player - 1];

    const card = document.getElementById(`card${player}`);
    card.classList.remove('pop');
    void card.offsetWidth;
    card.classList.add('pop');

    const flash = document.getElementById('flash');
    flash.className = `score-flash p${player} show`;
    setTimeout(() => flash.classList.remove('show'), 300);

    const name = document.getElementById('name' + player).textContent.trim();

    if (fromVoice) {
      setStatus('scoring', `🚗 ${name} got one! +1 point`);
      setTimeout(() => {
        if (listening) setStatus('wake', 'Listening… say "Yellow Car"');
      }, 2000);
    }

    updateLeaders();
    spawnConfetti(player);
    playScoreSound();
    addHistory(player, name);
    // Haptic feedback
    try { navigator.vibrate && navigator.vibrate([80, 40, 120]); } catch(e) {}
  }

  function updateLeaders() {
    document.getElementById('crown1').classList.toggle('visible', scores[0] > scores[1]);
    document.getElementById('crown2').classList.toggle('visible', scores[1] > scores[0]);
  }

  function resetScores() {
    scores = [0, 0];
    document.getElementById('score1').textContent = '0';
    document.getElementById('score2').textContent = '0';
    document.getElementById('crown1').classList.remove('visible');
    document.getElementById('crown2').classList.remove('visible');
    history = [];
    renderHistory();
    setStatus(listening ? 'wake' : 'off', listening ? 'Scores reset! Listening… say "Yellow Car"' : 'Scores reset');
  }

  function setStatus(state, msg) {
    document.getElementById('statusBar').className = 'status-bar ' + state;
    document.getElementById('statusMsg').textContent = msg;
  }

  function getName(player) {
    return document.getElementById(`name${player}`).textContent.toLowerCase().trim();
  }

  function syncManualNames() {
    document.getElementById('mName1').textContent = document.getElementById('name1').textContent;
    document.getElementById('mName2').textContent = document.getElementById('name2').textContent;
  }



  function editName(player) {
    const current = document.getElementById('name' + player).textContent.trim();
    const val = prompt('Enter name for Player ' + player + ':', current);
    if (val && val.trim()) {
      const name = val.trim();
      document.getElementById('name' + player).textContent = name;
      document.getElementById('mName' + player).textContent = name;
      try { localStorage.setItem('yc_name' + player, name); } catch(e) {}
    }
  }

  // Load saved names on startup
  function loadSavedNames() {
    try {
      const n1 = localStorage.getItem('yc_name1');
      const n2 = localStorage.getItem('yc_name2');
      if (n1) { document.getElementById('name1').textContent = n1; document.getElementById('mName1').textContent = n1; }
      if (n2) { document.getElementById('name2').textContent = n2; document.getElementById('mName2').textContent = n2; }
    } catch(e) {}
  }
  loadSavedNames();

  // ── Sound notifications ──────────────────────────────────────────────────
  function getAudioCtx() {
    return new (window.AudioContext || window.webkitAudioContext)();
  }

  // Short single ping when wake word "Yellow Car" is heard
  function playWakePing() {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
  }

  // Ascending three-note fanfare when a point is scored
  function playScoreSound() {
    try {
      const ctx = getAudioCtx();
      [[523, 0, 0.12], [659, 0.1, 0.18], [784, 0.22, 0.32]].forEach(([freq, start, end]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0, ctx.currentTime + start);
        gain.gain.linearRampToValueAtTime(0.9, ctx.currentTime + start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + end);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + end + 0.05);
      });
    } catch(e) {}
  }

  // ── History log ───────────────────────────────────────────────────────────
  let history = [];

  function addHistory(player, name) {
    const now = new Date();
    const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    history.unshift({ player, name, time, ts: Date.now() });
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    const empty = document.getElementById('historyEmpty');
    if (history.length === 0) {
      empty.style.display = 'block';
      // Remove all items
      list.querySelectorAll('.history-item').forEach(el => el.remove());
      return;
    }
    empty.style.display = 'none';
    // Rebuild list
    list.querySelectorAll('.history-item').forEach(el => el.remove());
    history.forEach((entry, i) => {
      const div = document.createElement('div');
      div.className = `history-item p${entry.player}`;
      const secsAgo = Math.floor((Date.now() - entry.ts) / 1000);
      const ago = secsAgo < 60 ? `${secsAgo}s ago` : `${Math.floor(secsAgo/60)}m${secsAgo%60 > 0 ? ' ' + (secsAgo%60) + 's' : ''} ago`;
      // Gap since previous car
      let gapStr = '';
      if (i < history.length - 1) {
        const gapSecs = Math.floor((entry.ts - history[i+1].ts) / 1000);
        if (gapSecs >= 5) {
          const gapMin = Math.floor(gapSecs / 60);
          gapStr = gapMin > 0 ? ` +${gapMin}m${gapSecs%60 > 0 ? (gapSecs%60)+'s' : ''}` : ` +${gapSecs}s`;
        }
      }
      div.innerHTML = `
        <span class="history-car">🚗</span>
        <span class="history-name p${entry.player}c">${entry.name}${gapStr ? '<span style="color:var(--text-dim);font-size:0.65rem;font-weight:700"> ' + gapStr + '</span>' : ''}</span>
        <span class="history-time">${entry.time}<br><span style="font-size:0.62rem;color:var(--text-dim)">${ago}</span></span>
      `;
      list.appendChild(div);
    });
  }

  // Update "ago" times every 10 seconds
  setInterval(renderHistory, 10000);

  function clearHistory() {
    history = [];
    renderHistory();
  }

  function spawnConfetti(player) {
    const layer = document.getElementById('confetti');
    const colors = player === 1
      ? ['#FF4D6D','#FF8FA3','#FFE000','#fff']
      : ['#3B9EFF','#74C0FC','#FFE000','#fff'];
    for (let i = 0; i < 28; i++) {
      const el = document.createElement('div');
      el.className = 'c';
      const size = 6 + Math.random() * 9;
      el.style.cssText = `
        left:${10+Math.random()*80}%;
        width:${size}px;
        height:${size*(Math.random()>0.5?1:2.5)}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        border-radius:${Math.random()>0.4?'50%':'2px'};
        animation-delay:${Math.random()*0.3}s;
        animation-duration:${0.9+Math.random()*0.7}s;
      `;
      layer.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }
  }

  // SW scoped to /yellow-car/ for GitHub Pages
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/yellow-car/sw.js', { scope: '/yellow-car/' }).catch(() => {});
  }

  // Wake Lock — keep screen on while listening
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch(e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && listening) requestWakeLock();
  });

</script>
</body>
</html>
